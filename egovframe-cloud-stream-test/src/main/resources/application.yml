# 접속 정보는 환경 변수로 재정의 (${변수:기본값}, 목록은 README 참고)
server:
  port: ${SERVER_PORT:9003}

spring:
  cloud:
    # 바인딩 대상 함수 (stream 하위가 아닌 cloud 하위에 선언)
    function:
      definition: basicProducer

    stream:
      # Supplier 기본 호출 주기(ms)
      poller:
        fixed-delay: 1000

      kafka:
        binder:
          autoCreateTopics: true
          autoAddPartitions: false
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:192.168.100.60:9092}
          # 클라이언트 텔레메트리 전송 비활성화
          configuration:
            enable.metrics.push: false

      bindings:
        basicProducer-out-0:
          destination: test-topic

logging:
  level:
    egovframework: DEBUG
    '[org.egovframe]': DEBUG
