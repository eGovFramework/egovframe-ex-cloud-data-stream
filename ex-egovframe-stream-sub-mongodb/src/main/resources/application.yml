# 접속 정보는 환경 변수로 재정의 (${변수:기본값}, 목록은 README 참고)
server:
  port: ${SERVER_PORT:9002}

spring:
  data:
    mongodb:
      database: ${MONGODB_DATABASE:com}
      uri: ${MONGODB_URI:mongodb://com:com01@localhost:27017/com}

  rabbitmq:
    host: ${RABBITMQ_HOST:192.168.100.60}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:egov}

  cloud:
    # 바인딩 대상 함수
    function:
      definition: sensorThermo;fileLine;historyDb;trainApi

    stream:
      kafka:
        binder:
          autoCreateTopics: false
          autoAddPartitions: false
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:192.168.100.60:9092}
          # 클라이언트 텔레메트리 전송 비활성화
          configuration:
            enable.metrics.push: false

      bindings:
        # IoT 온습도 센서 (큐: sensor.q_temp_humi)
        sensorThermo-in-0:
          destination: sensor
          group: q_temp_humi
          binder: rabbit

        # 파일 라인
        fileLine-in-0:
          destination: line-topic
          binder: kafka

        # DB 처리 이력
        historyDb-in-0:
          destination: db-topic
          binder: kafka

        # Open API(지하철 실시간 위치)
        trainApi-in-0:
          destination: api-topic
          binder: kafka

      # 사전 생성된 Exchange/Queue 사용 (선언·바인딩 생략)
      rabbit:
        bindings:
          sensorThermo-in-0:
            consumer:
              declareExchange: false
              bindQueue: false

logging:
  level:
    '[org.springframework.data.mongodb]': DEBUG
    '[egovframework.webflux.stream]': DEBUG

egov:
  websocket:
    # 브라우저에서 접속할 WebSocket 호스트
    host: ${WEBSOCKET_HOST:192.168.100.60}
