<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<title>Temperature Humidity Example</title>
</head>

<script type="text/javascript" th:src="@{/js/egovframework/jquery-3.6.1.min.js}"></script>
<script type="text/javascript" th:src="@{/js/egovframework/chart.min.js}"></script>

<script type="text/javascript">

	var wsocket;
	var rowCount = 0;
	var byteSize = 0;

	$(document).ready(function() {

		var serverUrl = $("#serverUrl").val();
		appendLog("Call Websocket URL : " + serverUrl);
		wsocket = new WebSocket(serverUrl);
		wsocket.onmessage = onMessage;
		wsocket.onclose = onClose;

		wsocket.onopen = function() {
			$('#sendBtn').click(function() { sendMessage(); });
			appendLog("Websocket open was successful!");
		};

		initChart();
	});
	
	function onMessage(evt) {
		var data = evt.data;
		const obj = JSON.parse(data);
		console.log("temperature = "+obj.temp);
		console.log("humidity = "+obj.humidity);

		rowCount++;
		byteSize += new Blob([data]).size;
		$("#rowCount").val(rowCount);
		$("#byteSize").val(byteSize);

		var now = new Date();
		var dateStr = now.toLocaleString('ko-KR');
		appendLog("Client Date : " + dateStr);
		appendLog("  temp=" + obj.temp + ", humidity=" + obj.humidity);

		updateGauge(chartTemp, obj.temp);
		updateGauge(chartHumi, obj.humidity);
	}
	
	function onClose(evt) {
		appendLog("Websocket Closed !!!");
	}

	function appendLog(msg) {
		var logArea = document.getElementById("logArea");
		logArea.value += msg + "\n";
		logArea.scrollTop = logArea.scrollHeight;
	}
	
	var chartTemp;
	var chartHumi;

	// 게이지 중앙에 현재 값 표시
	const gaugeLabel = {
		id: 'gaugeLabel',
		afterDraw(chart) {
			const g = chart.options.plugins.gauge;
			const ctx = chart.ctx;
			const area = chart.chartArea;
			ctx.save();
			ctx.textAlign = 'center';
			ctx.fillStyle = '#333';
			ctx.font = 'bold 28px sans-serif';
			ctx.fillText(g.value + g.unit, (area.left + area.right) / 2, area.bottom - 20);
			ctx.font = '12px sans-serif';
			ctx.fillText(g.min + ' ~ ' + g.max + g.unit, (area.left + area.right) / 2, area.bottom);
			ctx.restore();
		}
	};

	// 반원 도넛 차트로 게이지 구성 (yellowFrom·redFrom 이상이면 색상 변경)
	function createGauge(canvasId, title, gauge) {
		return new Chart(document.getElementById(canvasId).getContext('2d'), {
			type: 'doughnut',
			data: {
				labels: [title, ''],
				datasets: [{ data: [0, 1], backgroundColor: ['#2e7d32', '#e0e0e0'], borderWidth: 0 }]
			},
			options: {
				responsive: false,
				rotation: -90,
				circumference: 180,
				cutout: '70%',
				plugins: {
					legend: { display: false },
					tooltip: { enabled: false },
					title: { display: true, text: title, font: { size: 16 } },
					gauge: gauge
				}
			},
			plugins: [gaugeLabel]
		});
	}

	function updateGauge(chart, value) {
		const g = chart.options.plugins.gauge;
		const v = Math.min(Math.max(value, g.min), g.max);
		g.value = value;
		chart.data.datasets[0].data = [v - g.min, g.max - v];
		chart.data.datasets[0].backgroundColor[0] = v >= g.redFrom ? '#c62828' : (v >= g.yellowFrom ? '#f9a825' : '#2e7d32');
		chart.update();
	}

	function initChart() {
		chartTemp = createGauge('chartTemp', 'Temperature', { min: -40, max: 80, yellowFrom: 40, redFrom: 60, unit: '℃', value: 25 });
		chartHumi = createGauge('chartHumi', 'Humidity', { min: 0, max: 100, yellowFrom: 60, redFrom: 80, unit: '%', value: 50 });
		updateGauge(chartTemp, 25);
		updateGauge(chartHumi, 50);
	}
</script>
</head>
<body>

	Websocket Server URL : <input type="text" id="serverUrl" th:value="${websocketUrl}" style="width:400px"><br>
	<br>
	<b>* Total Stream Data</b><br>
	Row Count : <input type="text" id="rowCount" value="0" readonly style="width:150px"><br>
	Byte Size : <input type="text" id="byteSize" value="0" readonly style="width:150px"><br>
	<br>
	<canvas id="chartTemp" width="400" height="300" style="float: left;"></canvas>
	<canvas id="chartHumi" width="400" height="300" style="float: left;"></canvas>
	<div style="clear: both;"></div>
	<br>
	<textarea id="logArea" readonly style="width:700px; height:300px; font-family:monospace; font-size:13px;"></textarea>
    [[${contextPath}]]
</body>
</html>
