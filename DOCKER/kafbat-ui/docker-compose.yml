services:
  kafka-ui:
    networks:
      - kafka-network
    # Kafbat UI (Kafka 4.x KRaft 호환)
    image: ghcr.io/kafbat/kafka-ui:v1.4.2
    container_name: kafka-ui
    # 호스트:컨테이너
    ports:
      - "9980:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      # 컨테이너 내부 리스너 (kafka-network)
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
networks:
  kafka-network:
    external: true
    name: kafka-network