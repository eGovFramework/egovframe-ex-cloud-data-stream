services:
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.13-management
    networks:
      - egov-network
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
    # 계정은 .env(미커밋)로 주입, .env.example 참고.
    # 잘 알려진 기본 자격증명(guest/guest)으로 5672/15672 포트가 노출되지 않도록 비밀번호는 필수
    environment:
      TZ: Asia/Seoul
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required. Copy .env.example to .env and set it.}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-egov}
    # 환경 변수로 계정 정의를 생성한 뒤 기동
    entrypoint: ["sh", "/usr/local/bin/init-account.sh"]
    volumes:
      - ./init-account.sh:/usr/local/bin/init-account.sh:ro
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/20-egov.conf:ro
      # exchange·큐·바인딩 자동 생성 (변경 시 definitions.json 수정)
      - ./definitions.json:/etc/rabbitmq/definitions.d/20-topology.json:ro

networks:
  egov-network:
    name: egov-network
    external: true
