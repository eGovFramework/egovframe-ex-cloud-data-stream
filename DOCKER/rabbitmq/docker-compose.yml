services:
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.13-management
    networks:
      - egov-network
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
    # 실제 값은 .env(미커밋)로 주입, .env.example 참고. 미설정 시 이미지 기본값인 guest/guest가
    # 그대로 사용되어(15672/5672 포트가 호스트에 노출된 상태에서) 잘 알려진 기본 자격증명 노출로
    # 이어지므로 반드시 설정한다.
    environment:
      TZ: Asia/Seoul
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required. Copy .env.example to .env and set it.}

networks:
  egov-network:
    name: egov-network
    external: true