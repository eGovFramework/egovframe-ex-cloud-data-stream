services:
  mongodb:
    image: mongo:8.0.18
    container_name: my-mongodb
    networks:
      - egov-network
    ports:
      - 27017:27017
    # 실제 값은 .env(미커밋)로 주입, .env.example 참고
    environment:
      - MONGO_INITDB_DATABASE=${MONGODB_DATABASE:-com}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required. Copy .env.example to .env and set it.}
      # 애플리케이션 계정 (init-user.js 에서 생성)
      - MONGO_USERNAME=${MONGO_USERNAME:-com}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-com01}
    volumes:
      # 데이터가 없는 최초 기동 시 1회 실행
      - ./init-user.js:/docker-entrypoint-initdb.d/init-user.js:ro
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  egov-network:
    name: egov-network
    external: true
